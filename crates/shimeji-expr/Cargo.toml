[package]
name = "shimeji-expr"
version = "0.1.0"
description = "Sandboxed Shimeji expression evaluator and shared RNG."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# The evaluator has no dependencies. Only the `expr-check` CLI reads JSON.
cli = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "expr-check"
required-features = ["cli"]
