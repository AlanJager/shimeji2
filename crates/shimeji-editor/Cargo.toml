[package]
name = "shimeji-editor"
version.workspace = true
description = "Local animation editor as one binary. No Python runtime."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "shimeji-editor"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
crc32fast = "=1.5.2"
flate2 = { version = "1.1.1", default-features = false, features = ["rust_backend"] }
gif = "=0.14.2"
image-webp = "=0.1.3"
jpeg-decoder = { version = "=0.3.2", default-features = false }
png = "=0.18.1"
quick-xml = "=0.41.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
unicode-normalization = "=0.1.25"
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2"] }
