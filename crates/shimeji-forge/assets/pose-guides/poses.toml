# One line per classic frame. Slot contact rules for the group prompts live with these.

[[pose]]
index = 1
name = "stand"
text = "Standing still, relaxed. Feet on the bottom edge."

[[pose]]
index = 2
name = "walk-a"
text = "Walking, left foot forward. Feet on the bottom edge. Not a copy of the other walk frame."

[[pose]]
index = 3
name = "walk-b"
text = "Walking, right foot forward. Feet on the bottom edge. The opposite step from the other walk frame."

[[pose]]
index = 4
name = "fall"
text = "Falling, body tilted, sleeves and hair up. Feet off the ground."

[[pose]]
index = 5
name = "resist-a"
text = "Held and protesting, waving one way. Feet hang free."

[[pose]]
index = 6
name = "resist-b"
text = "Held and protesting, waving the other way. Feet hang free."

[[pose]]
index = 7
name = "pinched-a"
text = "Hanging straight down from a pinch at the top of the head. The top of the head touches the top edge."

[[pose]]
index = 8
name = "pinched-b"
text = "Hanging and swinging left. The top of the head touches the top edge."

[[pose]]
index = 9
name = "pinched-c"
text = "Hanging and swinging right. The top of the head touches the top edge."

[[pose]]
index = 10
name = "pinched-d"
text = "Hanging and dangling. The top of the head touches the top edge."

[[pose]]
index = 11
name = "sit"
text = "Sitting on the ground, looking ahead. Seat on the bottom edge. The body stays still through the head turn."

[[pose]]
index = 12
