[package]
name = "shimeji-forge"
version = "0.1.0"
description = "Pack generation CLI. Depends on shimeji-packs and shimeji-proto."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
gif = "=0.14.2"
png = "=0.18.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
shimeji-packs = { workspace = true }
shimeji-proto = { workspace = true }

[dev-dependencies]
gif = "=0.14.2"
serde_json = "=1.0.150"
